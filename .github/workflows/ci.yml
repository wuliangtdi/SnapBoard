name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore SnapBoard.slnx --locked-mode

      - name: Build
        run: dotnet build SnapBoard.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SnapBoard.slnx --configuration Release --no-build --no-restore

  native-aot:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore SnapBoard.slnx --locked-mode

      - name: Publish Native AOT shell
        run: >-
          dotnet publish src/SnapBoard.Desktop/SnapBoard.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:PublishAot=true
          -p:Version=0.0.0-ci
          -o artifacts/${{ matrix.rid }}

      - name: Verify Native AOT storage migrator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/${{ matrix.rid }}"
          $migrator = Join-Path $publishDirectory "SnapBoard.StorageMigrator.exe"
          if (-not (Test-Path -LiteralPath $migrator -PathType Leaf)) {
            throw "The Native AOT storage migrator is missing."
          }
          foreach ($forbidden in @(
            "SnapBoard.StorageMigrator.deps.json",
            "SnapBoard.StorageMigrator.runtimeconfig.json")) {
            if (Test-Path -LiteralPath (Join-Path $publishDirectory $forbidden)) {
              throw "Framework-dependent storage migrator artifact found: $forbidden"
            }
          }
          $process = Start-Process -FilePath $migrator -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 4) {
            throw "The storage migrator did not run as a standalone executable. Exit code: $($process.ExitCode)"
          }

      - name: Verify macOS Native AOT application and storage migrator
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/macos/Verify-NativePublish.sh "artifacts/${{ matrix.rid }}" "${{ matrix.rid }}"

      - uses: actions/upload-artifact@v7
        with:
          name: snapboard-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 7
