name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: SnapBoard-win-x64.zip
          # Linux 产品包暂时暂停：Infrastructure 的 Skia Linux 原生资产尚未纳入锁定依赖。
          # - os: ubuntu-latest
          #   rid: linux-x64
          #   archive: SnapBoard-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore SnapBoard.slnx --locked-mode

      - name: Restore pinned packaging tools
        run: dotnet tool restore

      - name: Publish Native AOT
        shell: bash
        run: |
          version="0.0.1-dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          dotnet publish src/SnapBoard.Desktop/SnapBoard.Desktop.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --no-restore \
            -p:PublishAot=true \
            -p:Version="$version" \
            -o artifacts/publish/${{ matrix.rid }}

      - name: Verify Native AOT storage migrator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/publish/${{ matrix.rid }}"
          $migrator = Join-Path $publishDirectory "SnapBoard.StorageMigrator.exe"
          if (-not (Test-Path -LiteralPath $migrator -PathType Leaf)) {
            throw "The Native AOT storage migrator is missing."
          }
          foreach ($forbidden in @(
            "SnapBoard.StorageMigrator.deps.json",
            "SnapBoard.StorageMigrator.runtimeconfig.json")) {
            if (Test-Path -LiteralPath (Join-Path $publishDirectory $forbidden)) {
              throw "Framework-dependent storage migrator artifact found: $forbidden"
            }
          }
          $process = Start-Process -FilePath $migrator -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 4) {
            throw "The storage migrator did not run as a standalone executable. Exit code: $($process.ExitCode)"
          }

      - name: Create self-updating package
        shell: bash
        run: |
          version="0.0.1-dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          channel="${{ matrix.rid }}-stable"
          if [[ "$version" == *-* ]]; then
            channel="${{ matrix.rid }}-beta"
          fi
          output_dir="artifacts/velopack/${{ matrix.rid }}"
          mkdir -p "$output_dir"
          common_args=(
            pack
            --outputDir "$output_dir"
            --channel "$channel"
            --runtime "${{ matrix.rid }}"
            --packId "com.wuliangtdi.snapboard.${{ matrix.rid }}"
            --packVersion "$version"
            --packDir "artifacts/publish/${{ matrix.rid }}"
            --packTitle "闪剪"
            --packAuthors "wuliangtdi"
            --delta None
          )
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            dotnet tool run vpk -- "${common_args[@]}" \
              --mainExe SnapBoard.Desktop.exe \
              --icon src/SnapBoard.Desktop/Assets/snapboard.ico \
              --msi \
              --instLocation Either
          else
            dotnet tool run vpk -- "${common_args[@]}" \
              --mainExe SnapBoard.Desktop \
              --icon src/SnapBoard.Desktop/Assets/snapboard-app-icon.png \
              --categories Utility
          fi

      - name: Customize selectable Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDirectory = (Resolve-Path -LiteralPath "artifacts/velopack/${{ matrix.rid }}").Path
          $msiPackages = @(Get-ChildItem -LiteralPath $packageDirectory -Filter "*.msi" -File)
          if ($msiPackages.Count -ne 1) {
            throw "Expected exactly one generated MSI, found $($msiPackages.Count)."
          }

          & "scripts/windows/Customize-VelopackMsi.ps1" -MsiPath $msiPackages[0].FullName

          $installerName = "SnapBoard-${{ matrix.rid }}-Installer.msi"
          $installerPath = Join-Path $packageDirectory $installerName
          Move-Item -LiteralPath $msiPackages[0].FullName -Destination $installerPath
          & "scripts/windows/Verify-VelopackMsi.ps1" -MsiPath $installerPath

          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -LiteralPath "$installerPath.sha256"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/*" -DestinationPath "artifacts/${{ matrix.archive }}"
          $hash = (Get-FileHash "artifacts/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.archive }}" | Set-Content "artifacts/${{ matrix.archive }}.sha256"

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -C "artifacts/publish/${{ matrix.rid }}" -czf "artifacts/${{ matrix.archive }}" .
          cd artifacts
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.archive }}
            artifacts/${{ matrix.archive }}.sha256
            artifacts/velopack/${{ matrix.rid }}/**
          if-no-files-found: error

  macos-package:
    name: Package ${{ matrix.rid }} App Bundle
    runs-on: ${{ matrix.os }}
    env:
      APP_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
      APP_SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
      INSTALLER_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
      INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
      INSTALLER_SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
      KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
      NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
      NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore pinned packaging tools
        run: dotnet tool restore

      - name: Validate Apple release credentials
        shell: bash
        run: |
          required=(
            APP_CERTIFICATE APP_CERTIFICATE_PASSWORD APP_SIGN_IDENTITY
            INSTALLER_CERTIFICATE INSTALLER_CERTIFICATE_PASSWORD INSTALLER_SIGN_IDENTITY
            KEYCHAIN_PASSWORD NOTARY_APPLE_ID NOTARY_PASSWORD NOTARY_TEAM_ID
          )
          missing=()
          configured=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            else
              configured=$((configured + 1))
            fi
          done
          if (( configured == 0 )); then
            echo "Apple signing credentials are not configured; producing ad-hoc/unsigned packages."
          elif (( ${#missing[@]} != 0 )); then
            printf 'Apple release secrets must be all-or-none. Missing: %s\n' "${missing[@]}" >&2
            exit 1
          else
            echo "Apple signing, installer signing, and notarization are enabled."
          fi

      - name: Import Apple signing identities
        if: env.APP_CERTIFICATE != ''
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/snapboard-signing.keychain-db"
          app_certificate="$RUNNER_TEMP/developer-id-application.p12"
          printf '%s' "$APP_CERTIFICATE" | base64 -D > "$app_certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$app_certificate" -k "$keychain" -P "$APP_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          if [[ -n "$INSTALLER_CERTIFICATE" ]]; then
            installer_certificate="$RUNNER_TEMP/developer-id-installer.p12"
            printf '%s' "$INSTALLER_CERTIFICATE" | base64 -D > "$installer_certificate"
            security import "$installer_certificate" -k "$keychain" -P "$INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Configure notarization profile
        if: env.NOTARY_APPLE_ID != ''
        shell: bash
        run: |
          xcrun notarytool store-credentials snapboard-ci \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID"

      - name: Build App Bundle, DMG, and PKG
        shell: bash
        run: |
          version="0.0.1-dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -n "$APP_SIGN_IDENTITY" ]]; then
            export SNAPBOARD_SIGN_IDENTITY="$APP_SIGN_IDENTITY"
          fi
          if [[ -n "$INSTALLER_SIGN_IDENTITY" ]]; then
            export SNAPBOARD_INSTALLER_IDENTITY="$INSTALLER_SIGN_IDENTITY"
          fi
          if [[ -n "$NOTARY_APPLE_ID" ]]; then
            export SNAPBOARD_NOTARY_PROFILE="snapboard-ci"
          fi
          mkdir -p "artifacts/macos/${{ matrix.rid }}"
          scripts/macos/Package-SnapBoard.sh \
            --runtime "${{ matrix.rid }}" \
            --version "$version" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output "artifacts/macos/${{ matrix.rid }}" \
            | tee "artifacts/macos/${{ matrix.rid }}/package-result-${{ matrix.rid }}.txt"

      - name: Verify macOS helper and App Bundle signing hierarchy
        shell: bash
        run: |
          output_root="artifacts/macos/${{ matrix.rid }}"
          scripts/macos/Verify-NativePublish.sh \
            "$output_root/publish-${{ matrix.rid }}" \
            "${{ matrix.rid }}"
          helper="$output_root/SnapBoard.app/Contents/MacOS/SnapBoard.StorageMigrator"
          if [[ ! -f "$helper" ]]; then
            echo "The App Bundle storage migrator is missing." >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$helper"
          codesign --verify --deep --strict --verbose=2 "$output_root/SnapBoard.app"

      - name: Create self-updating macOS package
        shell: bash
        run: |
          version="0.0.1-dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          channel="${{ matrix.rid }}-stable"
          if [[ "$version" == *-* ]]; then
            channel="${{ matrix.rid }}-beta"
          fi
          output_dir="artifacts/velopack/${{ matrix.rid }}"
          mkdir -p "$output_dir"
          vpk_args=(
            pack
            --outputDir "$output_dir"
            --channel "$channel"
            --runtime "${{ matrix.rid }}"
            --packId "com.wuliangtdi.snapboard.${{ matrix.rid }}"
            --packVersion "$version"
            --packDir "artifacts/macos/${{ matrix.rid }}/SnapBoard.app"
            --mainExe SnapBoard
            --packTitle "闪剪"
            --packAuthors "wuliangtdi"
            --bundleId com.wuliangtdi.snapboard
            --delta None
          )
          if [[ -n "$APP_SIGN_IDENTITY" ]]; then
            vpk_args+=(
              --signAppIdentity "$APP_SIGN_IDENTITY"
              --signInstallIdentity "$INSTALLER_SIGN_IDENTITY"
              --signEntitlements packaging/macos/SnapBoard.entitlements
              --notaryProfile snapboard-ci
            )
          fi
          dotnet tool run vpk -- "${vpk_args[@]}"

      - name: Remove temporary signing keychain
        if: always() && env.APP_CERTIFICATE != ''
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/snapboard-signing.keychain-db" || true

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/macos/${{ matrix.rid }}/SnapBoard-${{ matrix.rid }}.dmg
            artifacts/macos/${{ matrix.rid }}/SnapBoard-${{ matrix.rid }}.pkg
            artifacts/macos/${{ matrix.rid }}/SnapBoard-${{ matrix.rid }}.sha256
            artifacts/macos/${{ matrix.rid }}/package-result-${{ matrix.rid }}.txt
            artifacts/velopack/${{ matrix.rid }}/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, macos-package]
    runs-on: ubuntu-latest
    env:
      UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.SNAPBOARD_UPDATE_SIGNING_PRIVATE_KEY_PEM }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Sign and verify update feeds
        shell: bash
        run: |
          if [[ -z "$UPDATE_SIGNING_PRIVATE_KEY" ]]; then
            echo "Missing required secret: SNAPBOARD_UPDATE_SIGNING_PRIVATE_KEY_PEM" >&2
            exit 1
          fi
          private_key="$RUNNER_TEMP/snapboard-update-signing-private-key.pem"
          trap 'rm -f "$private_key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_PRIVATE_KEY" > "$private_key"
          chmod 0600 "$private_key"
          scripts/updates/Sign-UpdateFeeds.sh artifacts "$private_key"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t release_files < <(
            find artifacts -type f ! -name 'package-result-*.txt' -print | sort
          )
          if (( ${#release_files[@]} == 0 )); then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${release_files[@]}" --generate-notes --verify-tag
